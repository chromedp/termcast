on: [push, pull_request]
name: Test
jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25', '1.26', 'stable']
    # Run every command with GOWORK=off, so that no workspace changes the
    # result.
    env:
      GOWORK: "off"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # The runner image has Google Chrome installed. The tests need no
      # terminal.
      - name: Test
        run: go test -v ./...
